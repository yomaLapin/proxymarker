<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">


    <title>프록시 영상 마커 기록기</title>
    <style>
        /* 기본 설정 및 리셋 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            height: 100dvh; 
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
            touch-action: none; 
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }


        /* 앱 조작 UI: 장시간 터치/더블탭/마우스 드래그 시 텍스트 선택과 검색 메뉴 억제.
           영상, 시간 표시, 버튼, 마커, 기록 목록, 읽기 전용 안내 문구 모두 포함합니다. */
        html, body {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        /* 실제 텍스트 편집 요소만 선택 허용. 기본 UI의 터치/클릭 이벤트는 변경하지 않습니다. */
        input[type="text"], input[type="search"], input[type="number"],
        input[type="email"], input[type="url"], input[type="tel"],
        input[type="password"], textarea,
        [contenteditable=""], [contenteditable="true"] {
            -webkit-user-select: text;
            user-select: text;
            -webkit-touch-callout: default;
        }

        /* 상단 헤더 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: calc(8px + env(safe-area-inset-top)) 12px 8px 12px;
            background-color: #1e1e1e;
            flex-shrink: 0;
            gap: 10px;
        }
        .title-area {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
            min-width: 0;
            overflow: hidden;
        }
        #project-title {
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #creator-credit {
            font-size: 10px;
            color: #888;
            margin-top: 2px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .header-btn {
            background: #333; color: white; border: none; padding: 6px 8px;
            border-radius: 4px; font-size: 11px; cursor: pointer; white-space: nowrap;
        }
        .btn-danger-sm { background: #ff3b30; }


        /* v1.5.7: 제목 왼쪽 메뉴 버튼. 체크 화면 전환 버튼은 헤더에 유지합니다. */
        #menu-toggle {
            width: 32px; height: 32px; flex: 0 0 32px;
            display: inline-flex; align-items: center; justify-content: center;
            padding: 0; background: #333; color: #fff;
            border: 1px solid #484848; border-radius: 5px;
            font-size: 20px; line-height: 1; cursor: pointer;
            touch-action: manipulation;
        }
        #menu-toggle[aria-expanded="true"] { background: #007aff; border-color: #007aff; }

        /* 헤더 바로 아래에 펼쳐지는 서랍형 메뉴. 닫힌 상태에는 공간을 차지하지 않습니다. */
        #drawer-backdrop {
            display: none; position: fixed; z-index: 30;
            top: var(--drawer-top, 56px); bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,.55);
        }
        #drawer-backdrop.open { display: block; }
        #app-drawer {
            position: fixed; z-index: 31;
            display: flex; flex-direction: column;
            top: var(--drawer-top, 56px); bottom: 0;
            left: env(safe-area-inset-left);
            width: min(217.5px, calc(75vw - 21px)); /* v1.5.6 서랍 폭의 75% */
            padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
            background: #1e1e1e; border-right: 1px solid #3d3d3d;
            box-shadow: 5px 0 18px rgba(0,0,0,.35);
            overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
            transform: translateX(calc(-100% - 24px));
            visibility: hidden; pointer-events: none;
            transition: transform .18s ease, visibility .18s;
        }
        #app-drawer.open {
            transform: translateX(0); visibility: visible; pointer-events: auto;
        }
        .drawer-head { display: flex; align-items: center; margin-bottom: 12px; flex-shrink: 0; }
        .drawer-title { font-size: 13px; font-weight: bold; color: #ccc; }
        .drawer-action {
            display: block; width: 100%; margin-bottom: 8px;
            padding: 13px 12px; border: 0; border-radius: 6px;
            background: #333; color: #fff; text-align: left;
            font: inherit; font-size: 14px; cursor: pointer;
            text-decoration: none; touch-action: manipulation;
        }
        .drawer-action:active { filter: brightness(1.15); }
        .drawer-bottom-row {
            margin-top: auto; padding-top: 16px; display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 7px; flex-shrink: 0;
        }
        .drawer-bottom-row .drawer-action {
            margin: 0; padding: 12px 2px; text-align: center;
            font-size: 11px; white-space: nowrap;
        }
        /* 낮은 가로 화면에서도 마지막 두 버튼이 가능한 한 스크롤 없이 보이도록 조정합니다. */
        @media (orientation: landscape) and (max-height: 480px) {
            #app-drawer { padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
            .drawer-head { margin-bottom: 6px; }
            .drawer-action { padding: 9px 10px; margin-bottom: 5px; }
            .drawer-bottom-row { padding-top: 5px; }
            .drawer-bottom-row .drawer-action { padding: 10px 2px; margin-bottom: 0; }
        }

        /* 화면 전환 탭을 헤더에 배치해 별도 탭 행 제거 */
        #tab-menu {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            margin-right: 4px;
        }
        .tab-btn {
            flex: 0 0 auto; padding: 6px 7px;
            background: #2b2b2b; color: #bbb;
            border: 1px solid #444; border-radius: 4px;
            font-size: 11px; font-weight: bold; white-space: nowrap;
            cursor: pointer; transition: background 0.2s, color 0.2s;
        }
        .tab-btn.active { background: #007aff; border-color: #007aff; color: #fff; }
        @media (max-width: 420px) {
            header { gap: 4px; padding-left: 8px; padding-right: 8px; }
            .header-actions { gap: 3px; }
            #tab-menu { gap: 3px; margin-right: 2px; }
            .tab-btn { padding: 6px 5px; font-size: 10px; }
            .header-btn { padding: 6px; font-size: 10px; }
            #project-title { font-size: 12px; }
            #creator-credit { display: none; }
            #menu-toggle { width: 30px; height: 30px; flex-basis: 30px; font-size: 18px; }
        }
        @media (max-width: 360px) {
            header { gap: 3px; padding-left: 5px; padding-right: 5px; }
            #menu-toggle { width: 27px; height: 28px; flex-basis: 27px; font-size: 17px; }
            .tab-btn { padding: 6px 4px; font-size: 9px; }
            .header-btn { padding: 6px 4px; font-size: 9px; }
            .header-actions { gap: 2px; }
            #tab-menu { gap: 2px; margin-right: 1px; }
            #project-title { font-size: 11px; }
        }


        /* 메인 레이아웃 래퍼 */
        .app-body {
            display: none; 
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }
        .app-body.active-view { display: flex; } 


        /* ------ [기존] 체크(기록) 화면 스타일 ------ */
        .panel-left, .panel-right { display: contents; }


        #video-container { order: 1; }
        #progress-container { order: 2; }
        #marker-list-container { order: 5; flex: 1 1 100px; }
        #marker-pad-wrapper { order: 6; }


        @media (orientation: landscape) {
            #view-check { flex-direction: row; }
            /* 가로모드에서 마커 영역을 기존 45%의 절반(22.5%)으로 축소. 세로모드는 변경하지 않습니다. */
            .panel-left { display: flex; flex-direction: column; width: 77.5%; flex: 0 0 77.5%; min-width: 0; border-right: 1px solid #333; }
            .panel-right { display: flex; flex-direction: column; width: 22.5%; flex: 0 0 22.5%; min-width: 0; background: #121212; }

            /* 좁아진 마커 패널에서 이름·메모·작업 버튼이 잘리지 않도록 가로모드에서만 줄바꿈합니다. */
            .panel-right .record-item { flex-wrap: wrap; gap: 6px; }
            .panel-right .record-time { width: auto; flex: 0 0 auto; }
            .panel-right .record-info { flex: 1 1 100%; min-width: 0; margin: 0; flex-wrap: wrap; overflow-wrap: anywhere; }
            .panel-right .record-actions { display: flex; flex: 1 1 100%; gap: 6px; min-width: 0; }
            .panel-right .record-actions button { flex: 1 1 0; margin-left: 0; min-width: 0; }
            .panel-right .marker-page { gap: 4px; padding: 0 6px; }
            .panel-right .marker-btn { min-width: 0; padding: 12px 2px; font-size: 11px; overflow-wrap: anywhere; }
            
            #video-container, #progress-container,
            #marker-pad-wrapper, #marker-list-container { order: unset; }


            #video-container { flex: 1 1 auto; }
            #progress-container { flex-shrink: 0; }


            #marker-pad-wrapper { flex-shrink: 0; }
            #marker-list-container { flex: 1 1 100px; }
        }


        /* 영상 재생 영역 */
        #video-container { 
            position: relative; flex: 1 1 auto; background: #000; 
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; touch-action: none; 
        }
        #video-player { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        #play-indicator { position: absolute; font-size: 48px; color: rgba(255,255,255,0.7); opacity: 0; transition: opacity 0.2s; pointer-events: none; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #time-overlay { position: absolute; left: 10px; bottom: 10px; background: rgba(0, 0, 0, 0.6); padding: 4px 8px; border-radius: 4px; font-size: 12px; color: #fff; pointer-events: none; z-index: 10; font-variant-numeric: tabular-nums; }
        /* 영상 좌우 드래그 중 이동량과 도착 시간을 중앙에 표시 */
        #seek-overlay {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: none; flex-direction: column; align-items: center;
            gap: 5px; z-index: 11; pointer-events: none;
            padding: 12px 16px; min-width: 165px;
            max-width: calc(100% - 24px);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 10px; background: rgba(0,0,0,0.77);
            text-align: center;
        }
        #seek-overlay.visible { display: flex; }
        #seek-offset { font-size: 22px; font-weight: bold; font-variant-numeric: tabular-nums; white-space: nowrap; }
        #seek-target { font-size: 12px; color: #ddd; font-variant-numeric: tabular-nums; white-space: nowrap; }
        #progress-container { flex-shrink: 0; padding: 10px 12px; background: #1e1e1e; touch-action: none; }
        #progress-bar { position: relative; width: 100%; height: 14px; background: #41454b; border-radius: 7px; }
        #progress-fill { position: absolute; left: 0; top: 0; height: 100%; background: #67d1ff; border-radius: 7px; width: 0%; pointer-events: none; }
        #marker-dots-container { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
        .marker-dot { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 3px; height: 20px; border-radius: 0; border: none; box-shadow: 0 0 0 1px #15191f; pointer-events: none; }
        /* v1.5.6: 배속 조작은 영상의 하단 오른쪽, 시간 표시와 같은 높이에 배치. */
        #speed-btn {
            position: absolute; right: 10px; bottom: 10px; z-index: 12;
            min-width: 44px; min-height: 28px; padding: 4px 9px;
            border: 1px solid rgba(255,255,255,.30); border-radius: 5px;
            background: rgba(0,0,0,.70); color: #fff;
            font-size: 12px; font-weight: bold; line-height: 1.2;
            cursor: pointer; touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        #speed-btn:active { background: rgba(0,122,255,.85); }
        
        .btn { flex: 1; padding: 10px 0; text-align: center; background: #333; color: #fff; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-block; white-space: nowrap; }
        .btn-primary { background: #007aff; }

        /* 기존 조작 버튼의 선택 방지 규칙 유지(앱 전체 기본 정책을 보강). */
        button, label.btn, .marker-btn, .record-item, [role="button"] {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }


        #marker-pad-wrapper { flex-shrink: 0; background: #121212; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)) 0; }
        #marker-pages { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
        #marker-pages::-webkit-scrollbar { display: none; } 
        .marker-page { flex: 0 0 100%; scroll-snap-align: start; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 8px; padding: 0 12px; }
        .marker-btn { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; background: #2c2c2e; border: 2px solid transparent; border-radius: 8px; color: white; font-size: 13px; padding: 15px 5px; text-align: center; cursor: pointer; word-break: break-word; display: flex; align-items: center; justify-content: center; min-height: 50px; transition: opacity 0.2s; }
        .marker-btn.empty { background: transparent; border: 1px dashed #444; pointer-events: none; }
        .marker-btn.disabled { opacity: 0.3; pointer-events: none; }
        #page-indicators { text-align: center; margin-top: 8px; }
        .dot { display: inline-block; width: 6px; height: 6px; background: #555; border-radius: 50%; margin: 0 4px; }
        .dot.active { background: #fff; }


        #marker-list-container { flex: 1 1 100px; overflow-y: auto; background: #1e1e1e; padding: 10px 12px; touch-action: pan-y; }
        .record-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: #2c2c2e; border-radius: 6px; margin-bottom: 8px; font-size: 13px; cursor: pointer; }
        .record-item:active { background: #3a3a3c; } 
        .record-time { font-weight: bold; width: 60px; color: #aaa; }
        .record-info { flex: 1; display: flex; align-items: center; gap: 8px; margin: 0 10px; }
        .record-color { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .record-actions button { background: #444; border: none; color: white; padding: 5px 8px; border-radius: 4px; font-size: 11px; margin-left: 5px; cursor: pointer; }


        /* 파일·마커 관리 버튼은 헤더 아래 서랍 메뉴로 옮겼습니다. */
        
        /* 모달 */
        #modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .modal-content { background: #1e1e1e; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; }
        .modal-title { margin-bottom: 15px; font-size: 16px; }
        .modal-close { margin-top: 15px; width: 100%; }
        .edit-marker-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .edit-marker-row input[type="text"] { flex: 1; padding: 8px; border-radius: 4px; border: 1px solid #444; background: #333; color: white; font-size: 14px; }
        .edit-marker-row input[type="color"] { width: 40px; height: 40px; padding: 0; border: none; border-radius: 4px; }
        .add-marker-btn { width: 100%; padding: 10px; background: #007aff; border: none; color: white; border-radius: 6px; margin-bottom: 15px;}


        /* ------ 열람(View) 화면 전용 스타일 ------ */
        #view-read {
            background-color: #121212;
        }
        .read-settings {
            display: flex; flex-wrap: wrap; gap: 12px; padding: 15px 12px;
            background: #1e1e1e; border-bottom: 1px solid #333; flex-shrink: 0;
            align-items: center; font-size: 13px;
        }
        .setting-group {
            display: flex; align-items: center; gap: 6px;
        }
        .setting-group select, .setting-group input[type="text"] {
            background: #333; color: #fff; border: 1px solid #444; 
            padding: 6px; border-radius: 4px; font-size: 13px; outline: none;
        }
        .setting-group input[type="checkbox"] {
            width: 16px; height: 16px; accent-color: #007aff; cursor: pointer;
        }
        /* EDL 내보내기는 서랍으로 이동. List 화면은 마커 목록에 공간을 사용합니다. */
        #read-start-tc:invalid { border-color: #ff3b30; }

        #read-list-container {
            flex: 1; overflow-y: auto; padding: 12px; background: #121212; touch-action: pan-y;
        }
        .read-item {
            background: #1e1e1e; border-radius: 8px; padding: 12px; margin-bottom: 12px;
            display: flex; flex-direction: column; gap: 8px; border-left: 4px solid transparent;
            transition: opacity 0.2s;
        }
        .read-item.completed { opacity: 0.4; }
        .read-item-top {
            display: flex; justify-content: space-between; align-items: center;
        }
        .read-item-left {
            display: flex; align-items: center; gap: 8px;
        }
        .complete-checkbox {
            width: 18px; height: 18px; accent-color: #34c759; cursor: pointer;
        }
        .read-time-display { font-size: 15px; font-weight: bold; font-variant-numeric: tabular-nums; }
        .read-item-mid { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .read-item-bottom {
            background: #2c2c2e; padding: 8px 10px; border-radius: 4px; 
            font-size: 13px; color: #ccc; word-break: break-all;
        }
        .empty-read-msg {
            text-align: center; color: #666; margin-top: 40px; font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <button id="menu-toggle" type="button" aria-label="메뉴 열기" aria-controls="app-drawer" aria-expanded="false">☰</button>
        <div class="title-area">
            <div id="project-title">Proxy Marker v1.5.7 <span id="offline-badge" style="display:none; font-size:10px; color:#ffcc00; margin-left:5px;">(Offline)</span></div>
            <div id="creator-credit">Created by yomaLapin</div>
        </div>
        <div class="header-actions">
            <!-- 체크(기록) 복귀 버튼만 헤더에 유지합니다. -->
            <div id="tab-menu" role="group" aria-label="화면 전환">
                <button id="btn-tab-check" class="tab-btn active">체크 (기록)</button>
            </div>
        </div>
    </header>

    <!-- v1.5.7: 기존 버튼 ID를 유지하여 기능 로직을 그대로 재사용합니다. -->
    <div id="drawer-backdrop" aria-hidden="true"></div>
    <nav id="app-drawer" aria-label="Menu" aria-hidden="true">
        <div class="drawer-head"><span class="drawer-title">Menu</span></div>
        <label class="drawer-action" for="video-upload">Open(file)</label>
        <input type="file" id="video-upload" accept="video/*, audio/*" style="display:none;">
        <label class="drawer-action" for="json-load">Load(json)</label>
        <input type="file" id="json-load" accept=".json" style="display:none;">
        <button id="manage-markers" type="button" class="drawer-action">MarkerSet</button>
        <button id="btn-tab-read" type="button" class="drawer-action">List</button>
        <button id="export-save" type="button" class="drawer-action">Save(json)</button>
        <button id="export-resolve-edl" type="button" class="drawer-action">Save(EDL)</button>
        <div class="drawer-bottom-row">
            <button id="reset-btn" type="button" class="drawer-action">MarkerReset</button>
            <button id="fullscreen-btn" type="button" class="drawer-action">FullMode</button>
        </div>
    </nav>

    <!-- [기존 화면] 체크 (기록) 영역 -->
    <div id="view-check" class="app-body active-view">
        <div class="panel-left">
            <div id="video-container">
                <video id="video-player" playsinline></video>
                <div id="play-indicator">▶</div>
                <div id="seek-overlay" aria-hidden="true">
                    <div id="seek-offset">▶ +0.0초</div>
                    <div id="seek-target">이동 위치 00:00:00.0 / 00:00:00.0</div>
                </div>
                <div id="time-overlay">00:00:00 / 00:00:00</div>
                <button id="speed-btn" type="button" aria-label="재생 배속 변경">×1</button>
                <div id="video-placeholder" style="position: absolute; color: #888; text-align: center; pointer-events: none; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%;">
                    영상을 불러와주세요.
                </div>
            </div>


            <div id="progress-container">
                <div id="progress-bar">
                    <div id="progress-fill"></div>
                    <div id="marker-dots-container"></div>
                </div>
            </div>


            <!-- 기존 버튼 줄 제거: 확보한 공간은 영상/기록 영역이 활용합니다. -->

            <div id="marker-pad-wrapper">
                <div id="marker-pages"></div>

    <!-- [열람 (확인) 화면 영역] -->
    <div id="view-read" class="app-body">
        <div class="read-settings">

                <input type="checkbox" id="read-resolve-mode">

                <label for="read-fps">FPS:</label>
                <select id="read-fps">
                    <option value="23.976">23.976</option>

                    <option value="25">25</option>
                    <option value="29.97">29.97</option>
                    <option value="30">30</option>
                    <option value="50">50</option>
                    <option value="59.94">59.94</option>

    <div id="modal-overlay">

            <button class="btn modal-close" id="close-modal-btn">완료 및 저장</button>
        </div>
    </div>


    <script>
        const offlineBadge = document.getElementById('offline-badge');
        function updateOnlineStatus() {
            if (!navigator.onLine) {
                offlineBadge.style.display = 'inline';
            } else {
                offlineBadge.style.display = 'none';
            }
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();


        // --- 데이터 구조 ---
        const defaultMarkers = [
            { id: 1, name: '인점', color: '#ff3b30' },
            { id: 2, name: '아웃점', color: '#007aff' },
            { id: 3, name: '컷 전환', color: '#34c759' },
            { id: 4, name: 'CG 필요', color: '#af52de' },
            { id: 5, name: '음향 주의', color: '#ff9500' },
            { id: 6, name: '확인요망', color: '#ffcc00' }
        ];


        let state = { markers: [], records: [] };
        let currentVideoInfo = null;
        let currentVideoId = null;


        const DB_NAME = 'ProxyMarkerDB';
        const DB_VERSION = 1;
        let db = null;


        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains('settings')) {
                        database.createObjectStore('settings', { keyPath: 'id' });
                    }
                    if (!database.objectStoreNames.contains('projects')) {
                        database.createObjectStore('projects', { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve();
                };
                request.onerror = (e) => reject(e.target.error);
            });
        }


        function dbGet(storeName, key) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                const req = store.get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }


        function dbPut(storeName, data) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const req = store.put(data);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }


        // --- DOM Elements ---
        const video = document.getElementById('video-player');
        const videoContainer = document.getElementById('video-container');
        const fileInput = document.getElementById('video-upload');
        const jsonLoadInput = document.getElementById('json-load');
        const videoPlaceholder = document.getElementById('video-placeholder');
        const speedBtn = document.getElementById('speed-btn');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const dotsContainer = document.getElementById('marker-dots-container');
        const markerPages = document.getElementById('marker-pages');
        const pageIndicators = document.getElementById('page-indicators');
        const markerList = document.getElementById('marker-list');
        const resetBtn = document.getElementById('reset-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const playIndicator = document.getElementById('play-indicator');
        const timeOverlay = document.getElementById('time-overlay');
        const seekOverlay = document.getElementById('seek-overlay');
        const seekOffset = document.getElementById('seek-offset');
        const seekTarget = document.getElementById('seek-target');


        const btnTabCheck = document.getElementById('btn-tab-check');
        const btnTabRead = document.getElementById('btn-tab-read');
        const viewCheck = document.getElementById('view-check');
        const viewRead = document.getElementById('view-read');
        const readSortSelect = document.getElementById('read-sort');
        const readResolveMode = document.getElementById('read-resolve-mode');
        const readFpsSelect = document.getElementById('read-fps');
        const readStartTcInput = document.getElementById('read-start-tc');
        const readDropFrameSelect = document.getElementById('read-drop-frame');
        const exportResolveEdlButton = document.getElementById('export-resolve-edl');
        const readListContainer = document.getElementById('read-list-container');


        // v1.5.7: 서랍 열기/닫기 및 화면 회전 시 헤더 바로 아래에 맞춰 위치 조정.
        const menuToggle = document.getElementById('menu-toggle');
        const appDrawer = document.getElementById('app-drawer');
        const drawerBackdrop = document.getElementById('drawer-backdrop');
        let drawerOpen = false;

        function positionDrawer() {
            document.documentElement.style.setProperty('--drawer-top',
                `${document.querySelector('header').getBoundingClientRect().bottom}px`);
        }
        function setDrawerOpen(open) {
            drawerOpen = !!open;
            if (drawerOpen) { positionDrawer(); updateResolveExportStatus(); }
            appDrawer.classList.toggle('open', drawerOpen);
            drawerBackdrop.classList.toggle('open', drawerOpen);
            appDrawer.setAttribute('aria-hidden', String(!drawerOpen));
            menuToggle.setAttribute('aria-expanded', String(drawerOpen));
            menuToggle.setAttribute('aria-label', drawerOpen ? '메뉴 닫기' : '메뉴 열기');
            // 닫힌 상태에서 서랍 내 버튼이 키보드 포커스를 받지 않도록 합니다.
            if (drawerOpen) appDrawer.removeAttribute('inert');
            else appDrawer.setAttribute('inert', '');
        }
        appDrawer.setAttribute('inert', '');
        menuToggle.addEventListener('click', () => setDrawerOpen(!drawerOpen));
        drawerBackdrop.addEventListener('click', () => setDrawerOpen(false));
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && drawerOpen) {
                setDrawerOpen(false);
                menuToggle.focus();
            }
        });
        window.addEventListener('resize', () => { if (drawerOpen) positionDrawer(); });
        window.addEventListener('orientationchange', () => { if (drawerOpen) positionDrawer(); });
        // 파일 선택 창은 서랍을 닫기 전에 열도록 두고, 파일 선택 후 닫습니다.
        [fileInput, jsonLoadInput].forEach(input => {
            input.addEventListener('change', () => setDrawerOpen(false));
        });
        [document.getElementById('export-save'), document.getElementById('manage-markers'),
         exportResolveEdlButton, btnTabRead, resetBtn, fullscreenBtn]
            .forEach(btn => btn.addEventListener('click', () => setDrawerOpen(false)));

        async function initApp() {
            try {
                await initDB();
                await checkLegacyMigration();
                await loadGlobalSettings();
                renderMarkerPad();
                updateTimeOverlay();
                updateMarkerState();
                updatePlayIndicator();
                syncResolveSettings();
            } catch (err) {
                console.error("앱 초기화 오류:", err);
            }
        }


        async function checkLegacyMigration() {
            const legacy = localStorage.getItem('proxyMarkerState');
            if (legacy) {
                try {
                    const parsed = JSON.parse(legacy);
                    let migratedMarkers = false;
                    if (parsed.markers && parsed.markers.length > 0) {
                        state.markers = parsed.markers;
                        await saveGlobalSettings();
                        migratedMarkers = true;
                    }
                    if (parsed.records && parsed.records.length > 0) {
                        window.legacyRecords = parsed.records;
                        alert("이전 버전의 마커 기록이 발견되었습니다. 영상 불러오기 시 연결 가능합니다.");
                    } else if (migratedMarkers) {
                        localStorage.removeItem('proxyMarkerState');
                    }
                } catch(e) {
                    console.error("Legacy parsing error", e);
                }
            }
        }


        async function loadGlobalSettings() {
            const settings = await dbGet('settings', 'global');
            if (settings) {
                if (settings.markers) {
                    state.markers = settings.markers;
                } else {
                    state.markers = JSON.parse(JSON.stringify(defaultMarkers));
                }
                if (settings.fps) {
                    readFpsSelect.value = settings.fps;
                }
                if (settings.startTc) readStartTcInput.value = settings.startTc;
                if (settings.dropFrame === true) readDropFrameSelect.value = 'df';
            } else {
                state.markers = JSON.parse(JSON.stringify(defaultMarkers));
                await saveGlobalSettings();
            }
        }


        async function saveGlobalSettings() {
            const currentFps = readFpsSelect.value;
            await dbPut('settings', {
                id: 'global', markers: state.markers, fps: currentFps,
                startTc: readStartTcInput.value.trim(),
                dropFrame: readDropFrameSelect.value === 'df'
            });
        }


        async function loadProject(id) {
            const project = await dbGet('projects', id);
            if (project && project.records) {
                state.records = project.records;
            } else {
                state.records = []; 
            }
        }


        async function saveProject() {
            if (!currentVideoId) return;
            await dbPut('projects', {
                id: currentVideoId,
                name: currentVideoInfo.name,
                size: currentVideoInfo.size,
                lastModified: currentVideoInfo.lastModified,
                duration: currentVideoInfo.duration,
                records: state.records,
                updatedAt: new Date().toISOString()
            });
        }


        function formatHHMMSS(seconds) {
            if (isNaN(seconds) || seconds < 0) return "00:00:00";
            const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }


        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00.0";
            const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            const ms = Math.floor((seconds % 1) * 10).toString();
            if (seconds >= 3600) {
                const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
                return `${h}:${m}:${s}.${ms}`;
            }
            return `${m}:${s}.${ms}`;
        }


        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                video.src = url;
                videoPlaceholder.style.display = 'none';
                
                video.onloadedmetadata = async () => {
                    const dur = video.duration;
                    currentVideoInfo = {
                        name: file.name,
                        size: file.size,
                        lastModified: file.lastModified,
                        duration: dur
                    };
                    currentVideoId = `${file.name}_${file.size}_${file.lastModified}_${Math.floor(dur)}`;
                    
                    await loadProject(currentVideoId);


                    if (window.legacyRecords) {
                        if (confirm("이전에 작업하던 마커 기록이 존재합니다. 이 영상(프로젝트)에 연결하시겠습니까?")) {
                            state.records = window.legacyRecords;
                            delete window.legacyRecords;
                            localStorage.removeItem('proxyMarkerState');
                            await saveProject();
                        } else {
                            if(confirm("기존 기록을 삭제하시겠습니까?")) {
                                delete window.legacyRecords;
                                localStorage.removeItem('proxyMarkerState');
                            }
                        }
                    }


                    renderMarkerList();
                    renderProgressDots();
                    updateMarkerState();
                    updatePlayIndicator();
                    updateTimeOverlay();
                    
                    if (viewRead.classList.contains('active-view')) {
                        renderReadView();
                    }
                };
            }
            e.target.value = ''; 
        });


        function updateMarkerState() {
            const isVideoReady = video.src && video.readyState >= 1;
            const btns = document.querySelectorAll('.marker-btn:not(.empty)');
            btns.forEach(btn => {
                if (isVideoReady) {
                    btn.classList.remove('disabled');
                } else {
                    btn.classList.add('disabled');
                }
            });
        }


        function updatePlayIndicator() {
            if (!video.src || video.readyState === 0) {
                playIndicator.style.opacity = '0';
                return;
            }
            if (video.paused || video.ended) {
                playIndicator.style.opacity = '1';
            } else {
                playIndicator.style.opacity = '0';
            }
        }


        function updateTimeOverlay() {
            if (!video.src || video.readyState === 0) {
                timeOverlay.innerText = "00:00:00 / 00:00:00";
            } else {
                timeOverlay.innerText = `${formatHHMMSS(video.currentTime)} / ${formatHHMMSS(video.duration)}`;
            }
        }


        video.addEventListener('play', () => { updatePlayIndicator(); updateTimeOverlay(); });
        video.addEventListener('pause', () => { updatePlayIndicator(); updateTimeOverlay(); });
        video.addEventListener('ended', () => { updatePlayIndicator(); updateTimeOverlay(); });
        video.addEventListener('seeked', () => { updateTimeOverlay(); });
        video.addEventListener('timeupdate', () => {
            updateTimeOverlay();
            if (!video.duration) return;
            const percentage = (video.currentTime / video.duration) * 100;
            progressFill.style.width = `${percentage}%`;
        });


        const speeds = [1, 1.5, 2, 4];
        let currentSpeedIdx = 0;
        // 영상 재생/드래그 이벤트와 배속 버튼의 터치 이벤트가 충돌하지 않도록 분리합니다.
        speedBtn.addEventListener('pointerdown', event => event.stopPropagation());
        speedBtn.addEventListener('click', event => {
            event.stopPropagation();
            currentSpeedIdx = (currentSpeedIdx + 1) % speeds.length;
            const newSpeed = speeds[currentSpeedIdx];
            video.playbackRate = newSpeed;
            speedBtn.innerText = `×${newSpeed}`;
        });


        // --- 비디오 제어 통합 (Pointer Events 적용) ---
        let pointerStartX = 0;
        let pointerStartTime = 0;
        let isPointerSwiping = false;
        let activePointerId = null;
        let seekOverlayHideTimer = null;


        function formatSeekClock(seconds) {
            const safe = Number.isFinite(seconds) ? Math.max(0, seconds) : 0;
            const h = Math.floor(safe / 3600).toString().padStart(2, '0');
            const m = Math.floor((safe % 3600) / 60).toString().padStart(2, '0');
            const s = (safe % 60).toFixed(1).padStart(4, '0');
            return `${h}:${m}:${s}`;
        }


        function hideSeekOverlay(delay = 0) {
            if (seekOverlayHideTimer !== null) {
                clearTimeout(seekOverlayHideTimer);
                seekOverlayHideTimer = null;
            }
            if (delay > 0) {
                seekOverlayHideTimer = setTimeout(() => {
                    seekOverlay.classList.remove('visible');
                    seekOverlayHideTimer = null;
                }, delay);
            } else {
                seekOverlay.classList.remove('visible');
            }
        }


        function showSeekOverlay(startTime, targetTime) {
            const delta = targetTime - startTime;
            const arrow = delta >= 0 ? '▶' : '◀';
            const sign = delta >= 0 ? '+' : '−';
            seekOffset.textContent = `${arrow} ${sign}${Math.abs(delta).toFixed(1)}초`;
            seekTarget.textContent = `이동 위치 ${formatSeekClock(targetTime)} / ${formatSeekClock(video.duration)}`;
            seekOverlay.classList.add('visible');
        }


        videoContainer.addEventListener('pointerdown', (e) => {
            if (!video.src || video.readyState === 0) return;
            if (activePointerId !== null || (e.pointerType === 'mouse' && e.button !== 0)) return;


            hideSeekOverlay();
            activePointerId = e.pointerId;
            videoContainer.setPointerCapture(activePointerId);


            pointerStartX = e.clientX;
            pointerStartTime = video.currentTime;
            isPointerSwiping = false;
        });


        videoContainer.addEventListener('pointermove', (e) => {
            if (activePointerId !== e.pointerId) return;


            const diffX = e.clientX - pointerStartX;
            if (Math.abs(diffX) > 20) {
                if (!Number.isFinite(video.duration) || video.duration <= 0) return;
                isPointerSwiping = true;
                // 기존 이동 감도 유지: 화면 폭만큼 드래그 시 60초 이동
                const moveSeconds = (diffX / window.innerWidth) * 60;
                const newTime = Math.max(0, Math.min(pointerStartTime + moveSeconds, video.duration));
                video.currentTime = newTime;
                showSeekOverlay(pointerStartTime, newTime);
            }
        });


        function handlePointerEnd(e) {
            if (activePointerId !== e.pointerId) return;


            if (videoContainer.hasPointerCapture(activePointerId)) {
                videoContainer.releasePointerCapture(activePointerId);
            }
            activePointerId = null;


            if (e.type === 'pointercancel') {
                hideSeekOverlay();
                isPointerSwiping = false;
                return;
            }
            if (isPointerSwiping) {
                // 손을 뗀 뒤에도 이동 결과를 0.85초간 보여줌
                hideSeekOverlay(850);
            } else if (video.src && video.readyState >= 1) {
                if (video.paused) {
                    video.play().catch(err => console.error("비디오 재생 실패:", err));
                } else {
                    video.pause();
                }
            }
            isPointerSwiping = false;
        }


        videoContainer.addEventListener('pointerup', handlePointerEnd);
        videoContainer.addEventListener('pointercancel', handlePointerEnd);
        window.addEventListener('blur', () => {
            activePointerId = null;
            isPointerSwiping = false;
            hideSeekOverlay();
        });


        // --- 프로그레스 바 제어 ---
        function handleProgressInteract(e) {
            if (!video.duration) return;
            const rect = progressBar.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX; 
            let pos = (clientX - rect.left) / rect.width;
            pos = Math.max(0, Math.min(pos, 1));
            video.currentTime = pos * video.duration;
            updateTimeOverlay();
        }
        progressContainer.addEventListener('mousedown', (e) => {
            handleProgressInteract(e);
            const onMouseMove = (e) => handleProgressInteract(e);
            const onMouseUp = () => {
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            };
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });
        progressContainer.addEventListener('touchstart', handleProgressInteract, {passive: true});
        progressContainer.addEventListener('touchmove', handleProgressInteract, {passive: true});


        function renderProgressDots() {
            dotsContainer.innerHTML = '';
            if (!video.duration) return;
            
            state.records.forEach(record => {
                const percentage = (record.time / video.duration) * 100;
                const dot = document.createElement('div');
                dot.className = 'marker-dot';
                dot.style.left = `${percentage}%`;
                dot.style.backgroundColor = record.color;
                dotsContainer.appendChild(dot);
            });
        }


        function renderMarkerPad() {
            markerPages.innerHTML = '';
            pageIndicators.innerHTML = '';
            const totalMarkers = state.markers.length;
            const itemsPerPage = 6;
            const totalPages = Math.ceil(Math.max(totalMarkers, 1) / itemsPerPage);


            for (let p = 0; p < totalPages; p++) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'marker-page';
                for (let i = 0; i < itemsPerPage; i++) {
                    const markerIdx = p * itemsPerPage + i;
                    const btn = document.createElement('div');
                    if (markerIdx < totalMarkers) {
                        const markerInfo = state.markers[markerIdx];
                        btn.className = 'marker-btn';
                        btn.style.borderColor = markerInfo.color;
                        btn.innerText = markerInfo.name;
                        btn.addEventListener('click', () => { addRecord(markerInfo); });
                    } else {
                        btn.className = 'marker-btn empty';
                    }
                    pageDiv.appendChild(btn);
                }
                markerPages.appendChild(pageDiv);
                const dot = document.createElement('span');
                dot.className = 'dot' + (p === 0 ? ' active' : '');
                pageIndicators.appendChild(dot);
            }
            updateMarkerState();
        }
        markerPages.addEventListener('scroll', () => {
            const pageIndex = Math.round(markerPages.scrollLeft / markerPages.clientWidth);
            const dots = pageIndicators.querySelectorAll('.dot');
            dots.forEach((dot, idx) => { dot.classList.toggle('active', idx === pageIndex); });
        });


        async function addRecord(markerInfo) {
            if (!video.src || video.readyState === 0) return;


            const record = {
                id: Date.now(), 
                time: video.currentTime || 0,
                markerId: markerInfo.id,
                name: markerInfo.name,
                color: markerInfo.color,
                note: '',
                isCompleted: false 
            };
            state.records.push(record);
            state.records.sort((a, b) => a.time - b.time);
            
            await saveProject();
            renderMarkerList();
            renderProgressDots();
        }


        function renderMarkerList() {
            markerList.innerHTML = '';
            state.records.forEach(record => {
                const item = document.createElement('div');
                item.className = 'record-item';
                item.innerHTML = `
                    <div class="record-time">${formatTime(record.time)}</div>
                    <div class="record-info">
                        <span class="record-color" style="background-color:${record.color}"></span>
                        <span>${record.name}</span>
                        ${record.note ? `<span style="color:#aaa; font-size:11px;">[${record.note}]</span>` : ''}
                    </div>
                    <div class="record-actions">
                        <button onclick="event.stopPropagation(); editNote(${record.id})">메모</button>
                        <button onclick="event.stopPropagation(); deleteRecord(${record.id})">삭제</button>
                    </div>
                `;
                item.addEventListener('click', () => {
                    if (!video.src || video.readyState === 0) return;

        // FPS와 시작 TC는 Resolve 화면 미리보기를 꺼도 EDL 설정에 필요하므로 항상 활성화합니다.

        // Resolve 타임라인의 실제 프레임레이트는 1000/1001 정수 비율을 사용합니다.
        // 영상 시작부터의 시간은 가장 가까운 타임라인 프레임으로 반올림합니다.
        function getResolveRate() {
            const value = readFpsSelect.value;
            const rates = {
                '23.976': { fps: 24000 / 1001, nominal: 24 },
                '24': { fps: 24, nominal: 24 },
                '25': { fps: 25, nominal: 25 },
                '29.97': { fps: 30000 / 1001, nominal: 30 },
                '30': { fps: 30, nominal: 30 },
                '50': { fps: 50, nominal: 50 },
                '59.94': { fps: 60000 / 1001, nominal: 60 },
                '60': { fps: 60, nominal: 60 }
            };
            const rate = rates[value];
            if (!rate) throw new Error('지원하지 않는 FPS입니다.');
            return { ...rate, drop: readDropFrameSelect.value === 'df' };
        }

        function dropFramesPerMinute(rate) {
            if (!rate.drop) return 0;
            if (rate.nominal === 30 && readFpsSelect.value === '29.97') return 2;
            if (rate.nominal === 60 && readFpsSelect.value === '59.94') return 4;
            throw new Error('DF 타임코드는 29.97 또는 59.94fps에서만 선택할 수 있습니다.');
        }

        function parseTimelineTC(tc, rate) {
            const match = /^(\d{2}):(\d{2}):(\d{2})[:;](\d{2})$/.exec(String(tc).trim());
            if (!match) throw new Error('시작 TC 형식은 HH:MM:SS:FF (DF는 HH:MM:SS;FF)입니다.');
            const [h, m, s, f] = match.slice(1).map(Number);
            if (h > 23 || m > 59 || s > 59 || f >= rate.nominal) {
                throw new Error('시작 TC의 시·분·초·프레임 범위를 확인해 주세요.');
            }
            const drop = dropFramesPerMinute(rate);
            if (drop && m % 10 !== 0 && s === 0 && f < drop) {
                throw new Error('DF에서는 매 10분을 제외한 분 시작에 ;00~;0' + (drop - 1) + '을 사용할 수 없습니다.');
            }
            const minutes = h * 60 + m;
            return ((h * 3600 + m * 60 + s) * rate.nominal + f) -
                drop * (minutes - Math.floor(minutes / 10));
        }

        function formatTimelineTC(absoluteFrame, rate) {
            if (!Number.isSafeInteger(absoluteFrame) || absoluteFrame < 0) {
                throw new Error('유효하지 않은 프레임 위치입니다.');
            }
            const nominal = rate.nominal;
            const drop = dropFramesPerMinute(rate);
            const framesPerDay = nominal * 86400 - (drop ? drop * 54 * 24 : 0);
            if (absoluteFrame >= framesPerDay) {
                throw new Error('24시간 타임코드 범위를 넘었습니다. 시작 TC를 조정해 주세요.');
            }
            let labelFrame = absoluteFrame;
            if (drop) {
                const tenMinuteFrames = nominal * 600 - drop * 9;
                const oneMinuteFrames = nominal * 60 - drop;
                const tens = Math.floor(absoluteFrame / tenMinuteFrames);
                const remainder = absoluteFrame % tenMinuteFrames;
                // 10분 블록 내에서는 매 1분마다 건너뛴 레이블 수를 더합니다.
                const extra = remainder >= drop ? Math.floor((remainder - drop) / oneMinuteFrames) : 0;
                labelFrame += drop * 9 * tens + drop * extra;
            }
            const h = Math.floor(labelFrame / (nominal * 3600));
            const m = Math.floor((labelFrame % (nominal * 3600)) / (nominal * 60));
            const s = Math.floor((labelFrame % (nominal * 60)) / nominal);
            const f = labelFrame % nominal;
            const p = n => String(n).padStart(2, '0');
            return `${p(h)}:${p(m)}:${p(s)}${drop ? ';' : ':'}${p(f)}`;
        }

        function secondsToTimelineFrames(seconds, rate) {
            if (!Number.isFinite(seconds) || seconds < 0) {
                throw new Error('마커 기록에 잘못된 시간 값이 있습니다.');
            }
            return Math.round(seconds * rate.fps);
        }

        function calculateResolveTimecode(seconds, fpsFloat, startTcStr) {
            // 기존 열람 화면에서도 EDL과 동일한 프레임 변환을 사용합니다.
            try {
                const rate = getResolveRate();
                const startFrames = parseTimelineTC(startTcStr, rate);
                return formatTimelineTC(startFrames + secondsToTimelineFrames(seconds, rate), rate);
            } catch (error) {
                return 'TC 설정 오류';
            }
        }

        function syncResolveSettings() {
            const dfSupported = ['29.97', '59.94'].includes(readFpsSelect.value);
            if (!dfSupported && readDropFrameSelect.value === 'df') {
                readDropFrameSelect.value = 'ndf';
                readStartTcInput.value = readStartTcInput.value.replace(/;(\d{2})$/, ':$1');
            }
            readDropFrameSelect.disabled = !dfSupported;
            updateResolveExportStatus();
        }

        function getResolveMarkerColor(hex) {
            // Resolve의 16색 팔레트에 근사합니다. 순백색은 지원하지 않아 Cream 사용.
            const palette = [
                ['Blue', '#007aff'], ['Cyan', '#32ade6'], ['Green', '#34c759'],
                ['Yellow', '#ffcc00'], ['Red', '#ff3b30'], ['Pink', '#ff2d55'],
                ['Purple', '#af52de'], ['Fuchsia', '#d61c93'], ['Rose', '#f199b0'],
                ['Lavender', '#b9a6ed'], ['Sky', '#80c7ed'], ['Mint', '#93e4bc'],
                ['Lemon', '#f5e77b'], ['Sand', '#caba9b'], ['Cocoa', '#97775c'],
                ['Cream', '#f4eee4']
            ];
            let value = String(hex || '').trim();
            if (/^#[0-9a-f]{3}$/i.test(value)) {
                value = '#' + [...value.slice(1)].map(c => c + c).join('');
            }
            if (!/^#[0-9a-f]{6}$/i.test(value)) return 'Blue';
            const rgb = [1, 3, 5].map(i => parseInt(value.slice(i, i + 2), 16));
            if (rgb.every(c => c >= 220)) return 'Cream';
            let best = 'Blue', min = Infinity;
            palette.forEach(([name, color]) => {
                const other = [1, 3, 5].map(i => parseInt(color.slice(i, i + 2), 16));
                const distance = rgb.reduce((acc, c, i) => acc + (c - other[i]) ** 2, 0);
                if (distance < min) { min = distance; best = name; }
            });
            return best;
        }

        function safeEdlText(value) {
            // EDL은 줄 단위이며 |C:, |M:, |D:는 메타데이터 구분자입니다.
            return String(value == null ? '' : value)
                .replace(/[\r\n\t]+/g, ' / ')
                .replace(/\|/g, '｜')
                .replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g, ' ')
                .replace(/\s+/g, ' ').trim();
        }

        function buildResolveMarkerGroups(rate) {
            const byFrame = new Map();
            state.records.forEach((record, index) => {
                if (typeof record.time !== 'number') throw new Error('마커 기록 시간 형식이 올바르지 않습니다.');
                const frame = secondsToTimelineFrames(record.time, rate);
                if (!byFrame.has(frame)) byFrame.set(frame, []);
                byFrame.get(frame).push({ ...record, originalIndex: index });
            });
            return [...byFrame.entries()].sort((a, b) => a[0] - b[0]);
        }

        function makeResolveEdl(groups, rate, startFrames) {
            if (groups.length > 999) throw new Error('CMX3600 EDL은 최대 999개 이벤트까지 내보낼 수 있습니다.');
            const lines = ['TITLE: PROXYMARKER_MARKERS',
                `FCM: ${rate.drop ? 'DROP FRAME' : 'NON-DROP FRAME'}`, ''];
            groups.forEach(([frame, records], index) => {
                const tcIn = formatTimelineTC(startFrames + frame, rate);
                const tcOut = formatTimelineTC(startFrames + frame + 1, rate);
                const eventNo = String(index + 1).padStart(3, '0');
                // 동일 프레임의 모든 기록을 하나의 마커 텍스트에 통합합니다.
                const descriptions = records.map((record, i) => {
                    const name = safeEdlText(record.name) || '이름 없는 마커';
                    const note = safeEdlText(record.note);
                    const entry = note ? `${name} [메모: ${note}]` : name;
                    return records.length > 1 ? `[${i + 1}] ${entry}` : entry;
                });
                const colors = records.map(r => getResolveMarkerColor(r.color));
                const priority = ['Red', 'Yellow', 'Blue', 'Cream'];
                const chosenColor = [...colors].sort((a, b) => {
                    const ai = priority.indexOf(a), bi = priority.indexOf(b);
                    return (ai < 0 ? 4 : ai) - (bi < 0 ? 4 : bi);
                })[0];
                lines.push(`${eventNo}  001      V     C        ${tcIn} ${tcOut} ${tcIn} ${tcOut}`);
                lines.push(` |C:ResolveColor${chosenColor} |M:${descriptions.join(' / ')} |D:1`);
                lines.push('');
            });
            return lines.join('\r\n') + '\r\n';
        }

        function updateResolveExportStatus() {
            // Save(EDL)는 모든 화면에서 이용합니다. 출력 전 오류 검사는 기존 클릭 핸들러가 수행합니다.
            try {
                const rate = getResolveRate();
                const start = parseTimelineTC(readStartTcInput.value, rate);
                const groups = buildResolveMarkerGroups(rate);
                if (!currentVideoId || !groups.length) {
                    exportResolveEdlButton.title = '영상을 열고 마커를 기록하면 EDL로 저장할 수 있습니다.';
                    return;
                }
                formatTimelineTC(start + groups[groups.length - 1][0] + 1, rate);
                const merged = state.records.length - groups.length;
                exportResolveEdlButton.title = `EDL ${groups.length}개` +
                    (merged ? ` (동일 프레임 ${merged}개 병합)` : '');
            } catch (error) {
                exportResolveEdlButton.title = `EDL 설정 확인: ${error.message}`;
            }
        }

        exportResolveEdlButton.addEventListener('click', () => {
            try {
                if (!currentVideoId || state.records.length === 0) {
                    alert('영상을 불러오고 기록된 마커가 있어야 합니다.');
                    return;
                }
                const rate = getResolveRate();
                const startFrames = parseTimelineTC(readStartTcInput.value, rate);
                const groups = buildResolveMarkerGroups(rate);
                const merged = state.records.length - groups.length;
                const mixedColors = groups.filter(([, recs]) =>
                    new Set(recs.map(r => getResolveMarkerColor(r.color))).size > 1).length;
                // 변환할 수 없는 TC가 있는 경우 다운로드 전에 중단합니다.
                const edl = makeResolveEdl(groups, rate, startFrames);
                if (merged > 0 && !confirm(
                    `동일한 Resolve 프레임에 기록된 마커 ${merged}개를 병합합니다.\n` +
                    `${mixedColors ? `서로 다른 색상이 겹친 위치: ${mixedColors}곳 (빨강→노랑→파랑→Cream 우선)\n` : ''}` +
                    '모든 이름과 메모는 하나의 마커 텍스트로 합칩니다. 원본 기록과 JSON은 변경하지 않습니다.\n\n계속하시겠습니까?'
                )) return;
                const base = (currentVideoInfo.name || 'ProxyMarker').replace(/\.[^/.]+$/, '')
                    .replace(/[\\/:*?"<>|]/g, '_');
                // iPad Safari와 Android 브라우저에서 .edl.txt를 덧붙이지 않도록 텍스트 MIME 대신 바이너리 다운로드 MIME을 사용합니다.
                // EDL 텍스트 내용(UTF-8)은 기존과 완전히 동일합니다.
                downloadFile(edl, `${base}_Resolve_Markers.edl`, 'application/octet-stream');
            } catch (error) {
                alert('Resolve EDL 내보내기 실패: ' + error.message);
                updateResolveExportStatus();
            }
        });

        function renderReadView() {
            updateResolveExportStatus();
            readListContainer.innerHTML = '';
            
            if (state.records.length === 0) {
                readListContainer.innerHTML = '<div class="empty-read-msg">기록된 마커가 없습니다.<br>체크 탭에서 영상을 재생하고 마커를 기록해보세요.</div>';
                return;

            const sortOrder = readSortSelect.value;
            const isResolveMode = readResolveMode.checked;

            let sortedRecords = [...state.records];

                sortedRecords.sort((a, b) => a.time - b.time);

            sortedRecords.forEach((record, index) => {

                const timeString = isResolveMode 
                    ? calculateResolveTimecode(record.time, fpsFloat, startTcStr)
                    : formatTime(record.time);

                    .catch(err => console.log('Service Worker 등록 실패:', err));
            });
        }


        initApp();
    </script>
